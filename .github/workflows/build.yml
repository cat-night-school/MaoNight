name: Build Maonight IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip kit
        run: unzip -q dopamine-custom-kit.zip -d kit

      - name: Xcode setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Clone Dopamine 3.0.12
        run: git clone --depth 1 --branch 3.0.12 --recurse-submodules https://github.com/opa334/Dopamine.git dopamine

      - name: Apply Maonight customization
        run: bash kit/apply.sh dopamine

      - name: Rename product to Maonight
        run: |
          set -e
          cd dopamine/Application
          sed -i '' 's/PRODUCT_NAME = Dopamine;/PRODUCT_NAME = Maonight;/' Dopamine.xcodeproj/project.pbxproj || true
          sed -i '' 's/PRODUCT_NAME = "$(TARGET_NAME)";/PRODUCT_NAME = Maonight;/' Dopamine.xcodeproj/project.pbxproj || true
          sed -i '' 's#Dopamine\.app/Dopamine#Maonight.app/Maonight#g; s#Dopamine\.app#Maonight.app#g; s#Dopamine\.ipa#Maonight.ipa#g; s#Dopamine\.tipa#Maonight.tipa#g' Makefile

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)/dopamine"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar

      - name: Install libarchive
        run: brew install libarchive

      - name: Download bootstraps
        working-directory: dopamine/Application/Dopamine/Resources
        run: ./download_bootstraps.sh

      - name: Build
        working-directory: dopamine
        env:
          THEOS: ${{ github.workspace }}/dopamine/theos
        run: gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Maonight-Dopamine-IPA
          path: dopamine/Application/Maonight.ipa
