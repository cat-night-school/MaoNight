name: Build Maonight Dopamine IPA
on:
  workflow_dispatch:
    inputs:
      icon:
        description: '图标预设'
        required: false
        default: 'cat'
      bg:
        description: '背景预设（zhbai / xuanwu / fuhu / girl）'
        required: false
        default: 'zhbai'
      title:
        description: 'App 内标题'
        required: false
        default: '猫夜'
      author:
        description: '作者'
        required: false
        default: '王关喆'
      icon_url:
        description: '自定义图标图片直链（留空用仓库 icon.png）'
        required: false
        default: ''
      bg_url:
        description: '自定义内部背景图片直链（留空用仓库 bg.jpg）'
        required: false
        default: ''
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout kit
        uses: actions/checkout@v4
      - name: Xcode setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Clone Dopamine 3.0.12
        run: |
          git clone --depth 1 --branch 3.0.12 --recurse-submodules https://github.com/opa334/Dopamine.git dopamine
      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make trustcache
      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Apply Maonight customization
        env:
          TITLE: ${{ inputs.title }}
          AUTHOR: ${{ inputs.author }}
          BG: ${{ inputs.bg }}
          ICON: ${{ inputs.icon }}
        run: |
          chmod +x apply.sh
          bash apply.sh dopamine
      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)/dopamine"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "BASEDIR=$BASEDIR" >> $GITHUB_ENV
      - name: Install libarchive
        run: brew install libarchive
      - name: Download bootstraps
        working-directory: dopamine/Application/Dopamine/Resources
        run: ./download_bootstraps.sh
      - name: Guard project file
        run: |
          # 还原被全局改名过的工程文件，避免多个 framework 目标重名（Maonight.framework 冲突）
          git -C dopamine checkout -- Application/Dopamine.xcodeproj/project.pbxproj || true
          grep -c "Maonight.framework" dopamine/Application/Dopamine.xcodeproj/project.pbxproj || true
      - name: Build
        working-directory: dopamine
        env:
          THEOS: ${{ github.workspace }}/dopamine/theos
        run: gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1
      - name: Collect IPA
        run: |
          set -e
          ls -lh dopamine/Application/*.ipa || true
          mkdir -p out
          IPA=$(ls dopamine/Application/*.ipa | head -1)
          cp "$IPA" out/Maonight.ipa
          ls -lh out
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Maonight-Dopamine-IPA
          path: out/Maonight.ipa
