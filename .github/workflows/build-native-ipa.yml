name: Build Maonight Native IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -e
          if [ -f project.yml ]; then ROOT=.; elif [ -f ios-native/project.yml ]; then ROOT=ios-native; else echo "鎵句笉鍒?project.yml"; exit 1; fi
          cd "$ROOT"
          xcodegen generate

      - name: Build unsigned app
        run: |
          set +e
          if [ -f project.yml ]; then ROOT=.; else ROOT=ios-native; fi
          ( cd "$ROOT" && xcodebuild \
            -project MaonightNative.xcodeproj \
            -scheme MaonightNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build ) > "$GITHUB_WORKSPACE/last-build.log" 2>&1
          code=$?
          tail -c 200000 "$GITHUB_WORKSPACE/last-build.log" > "$GITHUB_WORKSPACE/last-build-tail.log" || true
          echo "xcodebuild exit=$code"
          exit $code

      - name: Package IPA
        if: success()
        run: |
          set -e
          if [ -f project.yml ]; then ROOT=.; else ROOT=ios-native; fi
          cd "$ROOT"
          rm -rf Payload MaonightNative.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MaonightNative.app Payload/
          zip -qr MaonightNative.ipa Payload
          cp MaonightNative.ipa "$GITHUB_WORKSPACE/MaonightNative.ipa"
          ls -lh "$GITHUB_WORKSPACE/MaonightNative.ipa"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaonightNative-IPA
          path: MaonightNative.ipa
          if-no-files-found: error

      - name: Save build log (always)
        if: always()
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name "maonight-ci"
          git config user.email "ci@maonight.local"
          if [ -f last-build-tail.log ]; then
            cp last-build-tail.log ios-native/last-build.log
            git add ios-native/last-build.log
            git commit -m "ci: last build log [skip ci]" || true
            git push || true
          fi
